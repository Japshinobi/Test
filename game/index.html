<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дедушкин огород</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: the world fills the whole window; HUD chips float top-left, tool belt floats bottom-centre, like Terraria. Blue inventory panels with gold highlights */
:root{
  --sky:#0f1638; --panel:#2c3c8c; --panel-2:#3d4fa8; --edge:#151b4a;
  --glass:rgba(44,60,140,.86); --glass-2:rgba(61,79,168,.88);
  --text:#ffffff; --muted:#c3cbf2; --gold:#ffd24a; --leaf:#2f9e3a;
  --up:#7be05a; --down:#ff7a5c;
  --f-pixel:"Press Start 2P","Courier New",monospace;
  --f-ui:"Rubik","Segoe UI",system-ui,sans-serif;
  --gl:max(10px,env(safe-area-inset-left,0px)); --gr:max(10px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--sky);color:var(--text);height:100%;margin:0;overflow:hidden}
body{font-family:var(--f-ui);font-size:15px;line-height:1.4}
.game{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:var(--gl);padding-right:var(--gr);pointer-events:none}
.top>*{pointer-events:auto}
.hud{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{background:var(--glass);border:2px solid var(--edge);border-radius:6px;padding:2px 8px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:1px 1px 0 #000}
.chip .k{color:var(--muted);font-size:13px}
.chip b{color:var(--gold);font-weight:500}
.chip.goal{min-width:200px}
.bar{height:8px;background:var(--edge);flex:1;min-width:50px;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.tools{display:flex;gap:5px;flex:none}
.mini{font:inherit;font-size:14px;background:var(--glass);color:var(--text);border:2px solid var(--edge);border-radius:6px;padding:3px 10px;cursor:pointer;text-shadow:1px 1px 0 #000}
.mini:hover{border-color:var(--gold)}
.bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 20px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.belt{pointer-events:auto}
.toast{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 110px);transform:translateX(-50%) translateY(6px);max-width:calc(100% - 24px);background:rgba(21,27,74,.92);border:2px solid var(--gold);border-radius:6px;padding:5px 10px;text-align:center;font-size:14px;text-shadow:1px 1px 0 #000;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.holding{font-size:13px;color:var(--muted);text-align:center;text-shadow:1px 1px 0 #000,0 0 4px #000}
.holding b{color:var(--text);font-weight:500}
.belt{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.slot{position:relative;background:var(--glass-2);border:2px solid var(--edge);border-radius:6px;padding:7px 0 5px;display:flex;justify-content:center;cursor:pointer;min-width:0;color:var(--text);font:inherit;text-shadow:1px 1px 0 #000}
.slot canvas{width:28px;height:28px;image-rendering:pixelated}
.slot.off::after{content:'';position:absolute;inset:3px;border-radius:4px;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(15,22,56,.45) 5px 7px);pointer-events:none}
@media (max-width:520px){.slot canvas{width:20px;height:20px}.slot .key{font-size:9px}.slot .n{font-size:10px}}
.slot[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-2);box-shadow:0 0 0 1px var(--gold)}
.slot .key{position:absolute;top:1px;left:4px;font-size:11px;color:var(--muted)}
.slot .n{position:absolute;bottom:1px;right:4px;font-size:12px;font-variant-numeric:tabular-nums}
.slot.none canvas{opacity:.35}
.kbd{font-size:12px;color:var(--muted);text-align:center;text-shadow:1px 1px 0 #000,0 0 4px #000}
.pad-row{display:none;position:absolute;left:var(--gl);right:var(--gr);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 92px);align-items:flex-end;justify-content:space-between;pointer-events:none}
.pad-row>*{pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.pad span{pointer-events:none}
.pad button,.act{font:inherit;background:var(--glass);color:var(--text);border:2px solid var(--edge);border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.pad button{font-size:20px}
.pad button:active,.act:active{background:var(--panel-2);border-color:var(--gold)}
.act{width:84px;height:84px;border-radius:50%;background:rgba(47,158,58,.9);border-color:var(--edge);font-size:15px;font-weight:500;text-shadow:1px 1px 0 #000}
@media (hover:none),(pointer:coarse){.pad-row{display:flex}.kbd{display:none}}
@media (max-width:640px){.chip{font-size:13px;padding:1px 6px}.chip .k{font-size:11px}.chip.goal{min-width:0;flex:1 1 160px}}
.overlay{position:fixed;inset:0;background:rgba(5,8,24,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.panel{background:rgba(44,60,140,.97);color:var(--text);border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 2px var(--panel-2),6px 6px 0 rgba(0,0,0,.4);max-width:500px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:18px;text-shadow:1px 1px 0 rgba(0,0,0,.6);font-size:16px}
.panel h2{margin:0 0 10px;font-family:var(--f-pixel);font-size:16px;line-height:1.45;font-weight:400;color:var(--gold);text-shadow:2px 2px 0 #000;text-wrap:balance}
.panel h3{margin:14px 0 6px;font-size:17px;color:var(--gold)}
.panel p{margin:0 0 10px}
.panel ol{margin:0 0 10px;padding-left:22px}
.panel li{margin-bottom:3px}
.small{font-size:14px}
.say{font-style:italic;color:#dfe5ff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;background:var(--leaf);color:#fff;border:2px solid var(--edge);border-radius:6px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 var(--edge);text-shadow:1px 1px 0 #000}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.alt{background:var(--panel-2)}
.btn.warn{background:#b8402c}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--edge);border-color:var(--edge)}
.btn.sm{padding:3px 8px;font-size:14px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{font:inherit;background:transparent;border:2px solid var(--edge);border-radius:6px;color:var(--text);padding:4px 12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--edge);border-color:var(--gold);color:var(--gold)}
.money{font-variant-numeric:tabular-nums}
.money b{font-size:20px;color:var(--gold)}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(170,180,232,.25)}
.row canvas{width:32px;height:32px;image-rendering:pixelated}
.row .nm{font-weight:500}
.row .sub{font-size:13px;color:var(--muted)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.up{color:var(--up)} .down{color:var(--down)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.cell{position:relative;font:inherit;font-size:13px;color:var(--text);background:var(--panel-2);border:2px solid var(--edge);border-radius:6px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-shadow:1px 1px 0 #000;min-width:0}
.cell:disabled{cursor:default;opacity:1}
.cell.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cell:not(:disabled):hover{border-color:var(--gold)}
.cell canvas{width:32px;height:32px;image-rendering:pixelated}
.cell .cn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cc{position:absolute;top:3px;right:6px;color:var(--gold);font-variant-numeric:tabular-nums}
.cell .cs{font-size:11px;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:420px){.row{grid-template-columns:32px minmax(0,1fr)}.row .acts{grid-column:1 / -1;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.toast,.bar i{transition:none}}
</style>

<div class="game">
  <canvas id="game" aria-label="Игровое поле: огород, дом, колодец и рынок"></canvas>

  <div class="top">
    <div class="hud">
      <div class="chip"><span id="day">День 1</span></div>
      <div class="chip"><span id="locName">Дедушкин огород</span></div>
      <div class="chip"><span id="clock">6:00</span><span class="k" id="part">утро</span></div>
      <div class="chip"><span class="k">Монеты</span><b id="money">100</b></div>
      <div class="chip"><span class="k">Вода</span><span id="water">10/10</span></div>
      <div class="chip"><span class="k">Корзина</span><span id="basket">0</span></div>
      <div class="chip goal"><span class="k" id="goalTxt">Ремонт дома</span><span class="bar"><i id="goalBar"></i></span></div>
    </div>

    </div>

  <div class="pad-row">

      <span></span><button type="button" data-dir="up" aria-label="Вверх">▲</button><span></span>
      <button type="button" data-dir="left" aria-label="Влево">◀</button><span></span><button type="button" data-dir="right" aria-label="Вправо">▶</button>

  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script src="sprites.js"></script>
<script>
(() => {
'use strict';
const T = 16, ART = 32, GOAL = 2500, SAVE_KEY = 'dedushkin-ogorod-v2';
const $ = s => document.querySelector(s);
let W = 36, H = 22;
const cv = $('#game'), ctx = cv.getContext('2d');

/* Screen scale. The art grid is 32 pixels per tile (ART). One art pixel covers k×k screen pixels,
   k a whole number picked from the window size: 2 on 1080p (like Terraria), 3 on 1440p, 4 on 4K.
   Draft sprites are still drawn on a 16-pixel grid (T) and stretched ×2 onto the 32 grid. */
const DRAFT = ART / T;
let k = 2, S = 4, viewW = 0, viewH = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(cv.clientWidth * dpr)), h = Math.max(1, Math.round(cv.clientHeight * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  k = Math.max(1, Math.round(Math.max(window.innerWidth, window.innerHeight) * dpr / 900));
  S = k * DRAFT; viewW = w / S; viewH = h / S;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

const {C, CROPS, SEASON_DAYS, seasonOf, lookFor, drawSnow, drawTrodden, drawFallen, clearCache, hash, drawGrass, drawPath, drawDirt, decoKind, fenceMask, cropStage, drawSoil, drawWater, iconCanvas, sprite, sunAt, castShadow, applyLight} = window.OgorodSprites;
const KEYS = Object.keys(CROPS);
const TOOLS = [{id:'hoe', name:'Мотыга'}, {id:'can', name:'Лейка'}, ...KEYS.map(k => ({id:'seed', k, name:CROPS[k].seedName}))];
const UPGRADES = [
  {id:'can',   name:'Большая лейка',     sub:'Вмещает 30 л вместо 10',            cost:250},
  {id:'house', name:'Отремонтировать дом', sub:'Главная цель: вернуть дому жизнь', cost:GOAL}
];
const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
const WALK = '.,=', INTERACT = 'DWSX~HI';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- state ---------- */
function newState() {
  const seeds = {}, produce = {};
  KEYS.forEach(k => { seeds[k] = 0; produce[k] = 0; });
  seeds.radish = 6; seeds.potato = 3;
  return {v:1, day:1, min:360, money:100, water:10, cap:10, house:false, loc:'farm', shipped:{},
          plots:{}, seeds, produce, tool:0, px:4, py:5, face:'down', intro:false, lateWarned:false, snowCover:false, snowTrod:{}};
}
function merge(s) {
  const b = newState();
  if (!s || typeof s !== 'object') return b;
  const o = {...b, ...s};
  o.seeds = {...b.seeds, ...(s.seeds || {})};
  o.produce = {...b.produce, ...(s.produce || {})};
  o.plots = s.plots && typeof s.plots === 'object' ? s.plots : {};
  o.snowTrod = s.snowTrod && typeof s.snowTrod === 'object' ? s.snowTrod : {};
  o.shipped = s.shipped && typeof s.shipped === 'object' ? s.shipped : {};
  if (!LOCATIONS[o.loc]) o.loc = 'farm';
  return o;
}
let state, player, map = [], bg = null, bgDirty = true, panelOpen = false, panelHandler = null, panelClosable = true;
let particles = [], soundOn = true, ac = null, toastTimer = 0;
const held = [];

function snap() { return {...state, px: player ? player.x : state.px, py: player ? player.y : state.py, face: player ? player.face : state.face}; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(snap())); } catch (e) {} }
function load() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

/* ---------- seasons and weather ---------- */
let look = null;
const season = () => seasonOf(state.day);
/* about every other winter day it snows; the snow settles by the next morning */
function weatherFor(day) { return seasonOf(day).id === 'winter' && hash(day, 5, 77) < 0.5 ? 'snow' : 'clear'; }
function refreshLook() { look = lookFor(state.day, state.snowCover); clearCache(); bgDirty = true; buildObjects(); }
const inSeason = (k, sid) => CROPS[k].seasons.includes(sid);
const canPlant = (k, sid) => (CROPS[k].plant || CROPS[k].seasons).includes(sid);
const seasonNames = list => list.map(id => ({spring:'весна', summer:'лето', autumn:'осень', winter:'зима'})[id]).join(', ');

/* ---------- locations ---------- */
/* Every location is its own map. Exits are path tiles on the map edge: stepping onto one fades over to the next location.
   at: where Тёма appears there. */
const LOCATIONS = {
  farm:   {name:'Дедушкин огород', W:36, H:22, build:buildFarm, exits:[
            {x0:12, x1:13, y0:0, y1:0, to:'forest', at:[14, 18], face:'up'},
            {x0:9, x1:10, y0:21, y1:21, to:'river', at:[14, 1], face:'down'},
            {x0:35, x1:35, y0:15, y1:16, to:'road', at:[1, 7], face:'right'}]},
  forest: {name:'Лес', W:30, H:20, build:buildForest, exits:[{x0:14, x1:15, y0:19, y1:19, to:'farm', at:[12, 1], face:'down'}],
           signs:{'16,15':'Лес. Скоро здесь можно будет собирать грибы, ягоды и хворост.'}},
  river:  {name:'Речка', W:30, H:18, build:buildRiver, exits:[{x0:14, x1:15, y0:0, y1:0, to:'farm', at:[9, 20], face:'up'}],
           signs:{'17,5':'Речка. Скоро здесь появится рыбалка.'}},
  road:   {name:'Дорога в деревню', W:30, H:14, build:buildRoad, exits:[{x0:0, x1:0, y0:7, y1:8, to:'farm', at:[34, 15], face:'left'}],
           signs:{'25,5':'До деревни два километра. Деревня и её жители появятся позже.'}}
};
const loc = () => LOCATIONS[state.loc];
function exitAt(x, y) { return (loc().exits || []).find(e => x >= e.x0 && x <= e.x1 && y >= e.y0 && y <= e.y1); }

function buildMap() {
  const L = loc(); W = L.W; H = L.H;
  map = Array.from({length:H}, () => Array(W).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) map[y][x] = c; };
  const rect = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, c); };
  for (let x = 0; x < W; x++) { set(x, 0, 'T'); set(x, H - 1, 'T'); }
  for (let y = 0; y < H; y++) { set(0, y, 'T'); set(W - 1, y, 'T'); }
  L.build(set, rect);
  (L.exits || []).forEach(e => rect(e.x0, e.y0, e.x1, e.y1, '='));
  Object.keys(L.signs || {}).forEach(k => { const [x, y] = k.split(',').map(Number); set(x, y, 'I'); });
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++)
    if (map[y][x] === '.' && hash(x, y, 7 + W) < 0.09) map[y][x] = ',';
}
function buildFarm(set, rect) {
  rect(2, 1, 5, 3, 'H'); set(4, 3, 'D');
  set(9, 2, 'W'); set(6, 3, 'S'); set(3, 4, 'X');
  /* paths: door → down to the road; road → right exit; a lane from the yard up to the top exit; a lane down to the bottom exit */
  rect(4, 4, 4, 15, '='); rect(4, 15, 35, 15, '='); rect(34, 16, 35, 16, '=');
  rect(4, 4, 12, 4, '='); rect(12, 0, 12, 4, '='); rect(13, 0, 13, 1, '=');
  rect(9, 15, 9, 21, '='); rect(10, 20, 10, 21, '=');
  rect(1, 16, 5, 19, '~'); rect(6, 17, 6, 18, '~');
  [[20,2],[24,2],[25,3],[30,2],[33,3],[34,6],[32,12],[33,13],[34,18],[31,18],[26,18],[22,17],[17,18],[14,19],[2,12],[1,9],[23,9],[28,6],[16,8]].forEach(([x, y]) => set(x, y, 'T'));
  [[16,2],[24,10],[8,17],[31,4],[19,19],[29,19],[6,10]].forEach(([x, y]) => set(x, y, 'B'));
}
function buildForest(set, rect) {
  rect(14, 12, 15, 19, '='); rect(10, 7, 19, 11, ',');
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (map[y][x] !== '.') continue;
    const r = hash(x, y, 201);
    if (r < 0.33) set(x, y, 'T'); else if (r < 0.4) set(x, y, 'B');
  }
}
function buildRiver(set, rect) {
  rect(0, 9, W - 1, 11, '~'); rect(14, 0, 15, 8, '='); rect(10, 8, 19, 8, '=');
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (map[y][x] !== '.') continue;
    const r = hash(x, y, 301);
    if (r < 0.1) set(x, y, 'T'); else if (r < 0.14) set(x, y, 'B');
  }
}
function buildRoad(set, rect) {
  rect(0, 7, 27, 8, '='); rect(28, 6, 29, 9, 'T');
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (map[y][x] !== '.' || Math.abs(y - 7.5) < 2) continue;
    const r = hash(x, y, 401);
    if (r < 0.18) set(x, y, 'T'); else if (r < 0.24) set(x, y, 'B');
  }
}
/* Where the hoe works: any grass on the farm, except the yard (the house and two tiles around it) */
function farmable(x, y) {
  if (state.loc !== 'farm' || !inMap(x, y)) return false;
  const ch = map[y][x];
  return (ch === '.' || ch === ',') && !(x <= 7 && y <= 5);
}
const plotAt = (x, y) => state.loc === 'farm' ? state.plots[x + ',' + y] : null;
const trodKey = (x, y) => state.loc + ':' + x + ',' + y;

const inMap = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const walkable = (x, y) => inMap(x, y) && WALK.includes(map[y][x]);

/* the ground for the day; with snow also a snowless copy, shown where Tёма has trodden the snow down */
let bgBare = null;
function buildGround(snow) {
  const c = document.createElement('canvas'); c.width = W * T; c.height = H * T;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = map[y][x];
    if (ch === '~') { g.fillStyle = C.water; g.fillRect(x * T, y * T, T, T); }
    else if (snow) drawSnow(g, x, y);
    else if (ch === '=') drawPath(g, x, y);
    else { drawGrass(g, x, y, look.grass); if (look.fallen && hash(x, y, 13) < .7) drawFallen(g, x, y, look.fallen); }
  }
  return c;
}
function buildBg() {
  bgBare = look.snow ? buildGround(false) : null;
  return buildGround(look.snow);
}
/* things that stand on the ground: drawn every frame sorted by where they touch the ground, and cast shadows */
let objects = [];
function buildObjects() {
  objects = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = map[y][x], px = x * T + T / 2, py = y * T + T;
    if (ch === 'T') objects.push({kind:'tree', a:hash(x, y, 11) < 0.35 ? 1 : 0, px, py});
    else if (ch === 'B') objects.push({kind:'bush', px, py});
    else if (ch === 'W') objects.push({kind:'well', px, py});
    else if (ch === 'S') objects.push({kind:'bin', px, py});
    else if (ch === 'X') objects.push({kind:'mailbox', px, py});
    else if (ch === 'I') objects.push({kind:'sign', px, py});
    else if (ch === ',' && look && look.flowers !== 'none' && !look.snow) objects.push({kind:'flower', a:x, b:y, px, py, tx:x, ty:y});
  }
  if (state.loc === 'farm') objects.push({kind:'house', px:2 * T, py:4 * T});
}

/* ---------- game logic ---------- */
function makePlayer() {
  let x = state.px, y = state.py;
  if (!walkable(x, y)) {
    /* the saved spot is blocked: stand on the nearest free tile instead */
    let best = null, bd = 1e9;
    for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++)
      if (walkable(xx, yy) && !exitAt(xx, yy)) { const d = Math.abs(xx - x) + Math.abs(yy - y); if (d < bd) { bd = d; best = [xx, yy]; } }
    if (best) [x, y] = best;
  }
  return {x, y, tx:x, ty:y, t:0, moving:false, face:state.face || 'down', path:[], pending:null, walk:0};
}
function dirTo(x, y, nx, ny) {
  if (nx > x) return 'right'; if (nx < x) return 'left'; if (ny > y) return 'down'; if (ny < y) return 'up'; return null;
}
function step(d) {
  const p = player; p.face = d;
  const [dx, dy] = DIRS[d], nx = p.x + dx, ny = p.y + dy;
  if (!walkable(nx, ny)) return false;
  p.tx = nx; p.ty = ny; p.moving = true; p.t = 0; return true;
}
function front() { const [dx, dy] = DIRS[player.face]; return [player.x + dx, player.y + dy]; }

function update(dt) {
  particles = particles.filter(q => (q.life -= dt) > 0);
  particles.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 140 * dt; });
  if (panelOpen) return;
  if (fade.dir) {
    fade.a += fade.dir * dt * 4;
    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; fade.dir = -1; enterLocation(fade.to.to, fade.to.at, fade.to.face); toast(loc().name); }
    else if (fade.dir < 0 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
    return;
  }
  state.min += dt * 4;
  if (state.min >= 1380 && !state.lateWarned) { state.lateWarned = true; toast(state.loc === 'farm' ? 'Уже 23:00. Пора домой — дверь дома в левом верхнем углу.' : 'Уже 23:00. Пора возвращаться домой.'); }
  if (state.min >= 1440) { newDay('Тёма так заработался, что уснул прямо на улице. Соседи проводили его до дома.'); return; }
  const p = player;
  if (p.moving) { p.t += dt / 0.15; p.walk += dt; if (p.t >= 1) {
    p.x = p.tx; p.y = p.ty; p.moving = false; p.t = 0;
    if (state.snowCover) state.snowTrod[trodKey(p.x, p.y)] = 1;
    const ex = exitAt(p.x, p.y);
    if (ex) { fade.dir = 1; fade.to = ex; held.length = 0; p.path = []; p.pending = null; return; }
  } }
  if (!p.moving) {
    const d = held[held.length - 1];
    if (d) { p.path = []; p.pending = null; step(d); }
    else if (p.path.length) { const [nx, ny] = p.path.shift(); if (!step(dirTo(p.x, p.y, nx, ny))) { p.path = []; p.pending = null; } }
    else if (p.pending) { const {x, y} = p.pending; p.pending = null; p.face = dirTo(p.x, p.y, x, y) || p.face; act(x, y); }
  }
}

/* switching locations */
const fade = {a:0, dir:0, to:null};
function enterLocation(id, at, face) {
  state.loc = id; state.px = at[0]; state.py = at[1]; state.face = face;
  buildMap(); refreshLook(); player = makePlayer(); particles = [];
  save();
}

function puff(tx, ty, color, n = 6) {
  for (let i = 0; i < n; i++) particles.push({x:tx * T + 8, y:ty * T + 9, vx:(Math.random() - .5) * 50, vy:-Math.random() * 50 - 10, life:.5, c:color});
}

function act(tx, ty) {
  ensureAudio();
  if (!inMap(tx, ty)) return;
  const c = map[ty][tx];
  if (c === 'D') return openSleep();
  if (c === 'S') return openShip();
  if (c === 'X') return openCatalog();
  if (c === 'I') return toast((loc().signs || {})[tx + ',' + ty] || 'Табличка.');
  if (c === 'W' || c === '~') {
    if (state.water >= state.cap) return toast('Лейка уже полная.');
    state.water = state.cap; SFX.water(); puff(tx, ty, C.waterL, 8);
    return toast('Лейка наполнена: ' + state.cap + ' л.');
  }
  if (c === 'H') return toast(state.house ? 'Дедушкин дом. Теперь в нём тепло и уютно.' : 'Дедушкин дом. Крыша течёт, доски скрипят. Нужен ремонт.');
  const tool = TOOLS[state.tool];
  const key = tx + ',' + ty, pl = plotAt(tx, ty), sid = season().id;
  if (!pl && !farmable(tx, ty)) {
    if (tool.id !== 'can' && (c === '.' || c === ',' || c === '=')) {
      SFX.nope();
      toast(state.loc !== 'farm' ? 'Копать можно только у себя на огороде.' : c === '=' ? 'На дороге копать нельзя.' : 'Во дворе у дома копать нельзя: отойдите на пару шагов.');
    }
    return;
  }
  if (pl && pl.c && pl.c.dead) { pl.c = null; SFX.till(); puff(tx, ty, '#8a6a3a', 8); return toast('Увядшее растение убрано. Грядка свободна.'); }
  if (pl && pl.c && pl.c.ripe) return harvest(tx, ty, pl);
  if (sid === 'winter' && tool.id !== 'can') { SFX.nope(); return toast('Зимой земля промёрзла. Огород отдыхает до весны.'); }
  if (tool.id === 'hoe') {
    if (!pl || !pl.t) { state.plots[key] = {t:1, w:0, c:null}; SFX.till(); puff(tx, ty, C.soil); }
    else if (pl.c) toast('Тут растёт: ' + CROPS[pl.c.k].name.toLowerCase() + '.');
    else toast('Земля уже вскопана. Выберите семена.');
    return;
  }
  if (tool.id === 'can') {
    if (!pl || !pl.t) { SFX.nope(); return toast('Сначала вскопайте землю мотыгой.'); }
    if (sid === 'winter') return toast('Зимой поливать не нужно: земля спит под снегом.');
    if (pl.w) return toast('Здесь уже полито.');
    if (state.water <= 0) { SFX.nope(); return toast('Лейка пуста. Наберите воды в колодце или пруду.'); }
    state.water--; pl.w = 1; SFX.water(); puff(tx, ty, C.waterL);
    return;
  }
  const k = tool.k, d = CROPS[k];
  if (!pl || !pl.t) { SFX.nope(); return toast('Сначала вскопайте землю мотыгой.'); }
  if (pl.c) return toast('Тут уже растёт: ' + CROPS[pl.c.k].name.toLowerCase() + '.');
  if (state.seeds[k] <= 0) { SFX.nope(); return toast('Закончилось: ' + d.seedName.toLowerCase() + '. Купите на рынке.'); }
  if (!canPlant(k, sid)) { SFX.nope(); return toast(d.name + ': сажают в сезон «' + seasonNames(d.plant || d.seasons) + '». Сейчас ' + season().name.toLowerCase() + '.'); }
  state.seeds[k]--; pl.c = {k, age:0, ripe:false, grown:false}; SFX.plant(); puff(tx, ty, '#4a2c16', 4);
}

function harvest(tx, ty, pl) {
  const d = CROPS[pl.c.k], n = d.yield || 1;
  state.produce[pl.c.k] += n;
  if (d.regrow) { pl.c.ripe = false; pl.c.age = d.grow - d.regrow; if (d.tree) pl.c.grown = true; }
  else pl.c = null;
  SFX.harvest(); puff(tx, ty, d.color, 10);
  toast('+' + n + ' ' + d.product.toLowerCase());
}

function factor(k, day = state.day) { return 0.8 + 0.45 * hash(day, KEYS.indexOf(k) + 1, 99); }
function price(k) { return Math.max(1, Math.round(CROPS[k].sell * factor(k))); }

function newDay(note) {
  const ripened = {}, withered = {}; let dry = 0;
  const snowed = weatherFor(state.day) === 'snow', before = season().id;
  const next = seasonOf(state.day + 1).id, changed = next !== before;
  for (const key in state.plots) {
    const pl = state.plots[key], c = pl.c;
    if (c && !c.dead) {
      const d = CROPS[c.k];
      if (d.tree) {
        /* the apple tree lives through every season; it grows up outside winter and bears fruit only in autumn */
        if (changed && c.ripe && !d.fruit.includes(next)) { c.ripe = false; c.age = d.grow - d.regrow; }
        if (before !== 'winter' && !c.ripe) {
          if (!c.grown || d.fruit.includes(before)) { if (!pl.w) dry++; c.age += pl.w ? 1 : 0.5; }
          if (c.age >= d.grow) {
            c.age = d.grow; c.grown = true;
            if (d.fruit.includes(next)) { c.ripe = true; ripened[c.k] = (ripened[c.k] || 0) + 1; }
            else c.age = d.grow - d.regrow;
          }
        }
      } else if (!c.ripe) {
        if (!pl.w) dry++;
        c.age += pl.w ? 1 : 0.5;
        if (c.age >= d.grow) { c.age = d.grow; c.ripe = true; ripened[c.k] = (ripened[c.k] || 0) + 1; }
      }
      /* out of season the plant withers */
      if (changed && !d.tree && !inSeason(c.k, next)) { c.dead = true; c.ripe = false; withered[c.k] = (withered[c.k] || 0) + 1; delete ripened[c.k]; }
    }
    pl.w = 0;
  }
  /* the shipping bin is emptied overnight at yesterday's prices */
  let shipped = 0;
  KEYS.forEach(k => { shipped += (state.shipped[k] || 0) * price(k); });
  state.money += shipped; state.shipped = {};
  state.day++; state.min = 360; state.lateWarned = false;
  /* snow: fresh snow covers yesterday's tracks; it melts when spring comes */
  if (season().id === 'winter') { if (snowed) { state.snowCover = true; state.snowTrod = {}; } }
  else { state.snowCover = false; state.snowTrod = {}; }
  held.length = 0; fade.a = 0; fade.dir = 0;
  enterLocation('farm', [4, 4], 'down');
  openMorning(note, ripened, dry, {changed, withered, snowed, shipped});
}

/* ---------- panels ---------- */
const overlay = $('#overlay'), panel = $('#panel');
function openPanel(html, handler, closable = true) {
  panel.innerHTML = html; panel.dataset.kind = '';
  panel.querySelectorAll('[data-icon]').forEach(el => { const [kind, k] = el.dataset.icon.split(':'); el.replaceWith(iconCanvas(kind, k)); });
  overlay.hidden = false; panelOpen = true; panelHandler = handler; panelClosable = closable; held.length = 0;
  if (player) { player.path = []; player.pending = null; }
  const f = panel.querySelector('[data-focus]') || panel.querySelector('button:not([disabled])');
  if (f) f.focus({preventScroll:true});
}
function closePanel() { overlay.hidden = true; panelOpen = false; panelHandler = null; }
panel.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  ensureAudio();
  if (b.hasAttribute('data-close')) { closePanel(); return; }
  if (panelHandler) panelHandler(b);
});
overlay.addEventListener('click', e => { if (e.target === overlay && panelClosable) closePanel(); });

}
const SEASON_TEXT = {
  spring:'Наступила весна! Снег сошёл, деревья просыпаются, на лугу зацветают цветы.',
  summer:'Наступило лето! Тепло, всё зелёное, самое время для огурцов и помидоров.',
  autumn:'Наступила осень! Листья скоро пожелтеют, а яблони дадут урожай.',
  winter:'Наступила зима! Земля промёрзла, огород отдыхает до весны. Скоро выпадет снег.'
};
function openMorning(note, ripened, dry, ex = {}) {
  const list = Object.keys(ripened).map(k => CROPS[k].product + ' ×' + ripened[k]).join(', ');
  const dead = Object.keys(ex.withered || {}).map(k => CROPS[k].name + ' ×' + ex.withered[k]).join(', ');
  const s = season(), now = KEYS.filter(k => canPlant(k, s.id)).map(k => CROPS[k].name.toLowerCase());
  let best = KEYS[0]; KEYS.forEach(k => { if (factor(k) > factor(best)) best = k; });
  const weather = weatherFor(state.day) === 'snow' ? '<p>Сегодня идёт снег.</p>' : '';
  openPanel(`<h2>${s.name}, день ${s.d} из ${SEASON_DAYS}</h2>
    ${ex.changed ? `<p><b>${SEASON_TEXT[s.id]}</b></p>` : ''}
    ${ex.changed && dead ? `<p>Не пережили смену сезона: ${dead}. Уберите увядшие растения с грядок.</p>` : ''}
    ${ex.changed && now.length ? `<p>В этом сезоне сажают: ${now.join(', ')}.</p>` : ''}
    ${ex.snowed && s.id === 'winter' ? '<p>За ночь всё засыпало снегом.</p>' : ''}

    ${dry ? `<p>Без полива осталось растений: ${dry}. Они росли вдвое медленнее.</p>` : ''}
    <p>Сегодня дороже всего принимают: ${CROPS[best].product.toLowerCase()}, по ${price(best)} монет.</p>
    <div class="btns"><button class="btn" data-close data-focus>Доброе утро!</button></div>`);
}
function openWin() {
  openPanel(`<h2>Дом отремонтирован!</h2>
    <p>Крыша больше не течёт, в окнах новые стёкла, на подоконниках цветы. Дедушка Матвей был бы рад.</p>
    <p>Вы справились за ${state.day} ${plural(state.day, 'день', 'дня', 'дней')}. Огород ваш: можно играть дальше, растить яблони и копить монеты.</p>
    <div class="btns"><button class="btn" data-close data-focus>Продолжить</button></div>`);
}
function plural(n, a, b, c) { const m = n % 100, d = n % 10; if (m > 10 && m < 20) return c; if (d === 1) return a; if (d > 1 && d < 5) return b; return c; }

const trendOf = k => { const f = factor(k); return f > 1.08 ? '<span class="up">▲ сегодня дорого</span>' : f < 0.92 ? '<span class="down">▼ сегодня дёшево</span>' : 'обычная цена'; };
/* shipping bin: put produce in, the money comes next morning */
function openShip() {
  let body = '', inBin = 0, total = 0;
  KEYS.forEach(k => {
    const n = state.produce[k], m = state.shipped[k] || 0;
    inBin += m * price(k);
    if (!n) return;
    total += n * price(k);
    body += `<div class="row"><span data-icon="prod:${k}"></span><div><div class="nm">${CROPS[k].product} ×${n}</div><div class="sub">${price(k)} мон. за шт. · ${trendOf(k)}</div></div>
      <div class="acts"><button class="btn alt sm" data-ship="${k}:1">Положить 1</button><button class="btn sm" data-ship="${k}:all">Все за ${n * price(k)}</button></div></div>`;
  });
  const binList = KEYS.filter(k => state.shipped[k]).map(k => CROPS[k].product + ' ×' + state.shipped[k]).join(', ');
  openPanel(`<h2>Ящик для отгрузки</h2>
    <p>Положите урожай в ящик. Утром его заберут, а деньги появятся у вас.</p>
    ${binList ? `<p>Уже в ящике: ${binList}. Утром получите ${inBin} мон.</p>` : ''}
    ${body || '<p>В сумке нет урожая. Соберите его на огороде.</p>'}
    <div class="btns">${body ? `<button class="btn" data-ship="all:all" data-focus>Положить всё за ${total}</button>` : ''}<button class="btn alt" data-close>Закрыть</button></div>`, b => {
    if (!b.dataset.ship) return;
    const [k, q] = b.dataset.ship.split(':');
    let put = 0;
    (k === 'all' ? KEYS : [k]).forEach(key => {
      const n = q === 'all' ? state.produce[key] : Math.min(1, state.produce[key]);

/* mailbox: order seeds and upgrades from the catalogue */
function openCatalog() {
  let body = '<h3>Семена и саженцы</h3>';
  KEYS.forEach(k => {
    const d = CROPS[k], now = canPlant(k, season().id);
    const info = `${d.seed} мон. · ${seasonNames(d.plant || d.seasons)}${now ? '' : ' (сейчас не сезон)'} · растёт ${d.grow} ${plural(d.grow, 'день', 'дня', 'дней')}` + (d.regrow ? `, потом урожай каждые ${d.regrow} дн.` : '') + (d.fruit ? ', плоды осенью' : '') + ` · у вас ${state.seeds[k]}`;
    body += `<div class="row"><span data-icon="seed:${k}"></span><div><div class="nm">${d.seedName}</div><div class="sub">${info}</div></div>
      <div class="acts"><button class="btn alt sm" data-buy="${k}:1" ${state.money < d.seed ? 'disabled' : ''}>+1</button><button class="btn sm" data-buy="${k}:5" ${state.money < d.seed * 5 ? 'disabled' : ''}>+5 за ${d.seed * 5}</button></div></div>`;
  });
  body += '<h3>Улучшения</h3>';
  UPGRADES.forEach(u => {
    const done = (u.id === 'can' && state.cap > 10) || (u.id === 'house' && state.house);
    body += `<div class="row"><span data-icon="${u.id}"></span><div><div class="nm">${u.name}</div><div class="sub">${u.sub}</div></div>
      <div class="acts"><button class="btn sm" data-up="${u.id}" ${done || state.money < u.cost ? 'disabled' : ''}>${done ? 'Куплено' : u.cost + ' мон.'}</button></div></div>`;
  });
  openPanel(`<h2>Каталог семян почтой</h2>
    <p>Пока в деревне нет лавки, всё нужное можно заказать по почте. Заказ сразу оказывается в сумке.</p>
    <div class="money">Монеты: <b>${state.money}</b></div>${body}
    <div class="btns"><button class="btn alt" data-close data-focus>Закрыть</button></div>`, b => {
    const ds = b.dataset;
    if (ds.buy) {
      const [k, q] = ds.buy.split(':'), n = +q, cost = CROPS[k].seed * n;
      if (state.money >= cost) { state.money -= cost; state.seeds[k] += n; SFX.coin(); }
    }
    if (ds.up) {
      const u = UPGRADES.find(x => x.id === ds.up);
      if (u && state.money >= u.cost) {
        state.money -= u.cost; SFX.coin();
        if (u.id === 'can') { state.cap = 30; state.water = 30; }
        if (u.id === 'house') { state.house = true; clearCache(); save(); return openWin(); }
      }

    save(); openCatalog();
  });
}
/* the bag: everything Тёма carries. Tap a tool or seeds to take them in hand */
function openInventory() {
  const cell = (i, icon, name, n, extra = '') => `<button class="cell${state.tool === i ? ' on' : ''}" ${i >= 0 ? `data-take="${i}"` : 'disabled'} type="button">
      <span data-icon="${icon}"></span><span class="cn">${name}</span>${n !== '' ? `<span class="cc">${n}</span>` : ''}${extra}</button>`;
  const tools = cell(0, 'hoe', 'Мотыга', '') + cell(1, 'can', 'Лейка', state.water + '/' + state.cap);
  const seeds = KEYS.map((k, j) => state.seeds[k] ? cell(j + 2, 'seed:' + k, CROPS[k].name, state.seeds[k], canPlant(k, season().id) ? '' : '<span class="cs">не сезон</span>') : '').join('');
  const prod = KEYS.map(k => state.produce[k] ? cell(-1, 'prod:' + k, CROPS[k].product, state.produce[k]) : '').join('');
  openPanel(`<h2>Сумка</h2>
    <div class="money">Монеты: <b>${state.money}</b></div>
    <h3>Инструменты</h3><div class="inv">${tools}</div>
    <h3>Семена</h3>${seeds ? `<div class="inv">${seeds}</div>` : '<p class="small">Семян нет. Закажите их в почтовом ящике у дома.</p>'}
    <h3>Урожай</h3>${prod ? `<div class="inv">${prod}</div>` : '<p class="small">Урожая пока нет.</p>'}
    <p class="small">Нажмите на инструмент или семена, чтобы взять их в руки. Урожай продают через ящик для отгрузки у дома.</p>
    <div class="btns"><button class="btn alt" data-close data-focus>Закрыть (I)</button></div>`, b => {
    if (b.dataset.take) { state.tool = +b.dataset.take; hud(); closePanel(); }
  });
  panel.dataset.kind = 'bag';
}

/* ---------- sound ---------- */
function ensureAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function beep(freq, dur = .08, type = 'square', vol = .05, slide = 0) {
  if (!soundOn || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const SFX = {
  till: () => beep(150, .09, 'square', .05, -60),
  water: () => beep(700, .14, 'sine', .06, -400),
  plant: () => beep(440, .07, 'triangle', .07),
  harvest: () => { beep(660, .07, 'square', .04); setTimeout(() => beep(880, .1, 'square', .04), 70); },
  coin: () => { beep(988, .05, 'square', .04); setTimeout(() => beep(1319, .12, 'square', .04), 50); },
  nope: () => beep(110, .12, 'sawtooth', .03)
};

/* ---------- HUD ---------- */
const toastEl = $('#toast');
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2600);
}
function clockText() { const m = Math.floor(state.min / 10) * 10; return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }
const setText = (el, v) => { if (el.textContent !== v) el.textContent = v; };
const els = {locName:$('#locName'), day:$('#day'), clock:$('#clock'), part:$('#part'), money:$('#money'), water:$('#water'), basket:$('#basket'), goalTxt:$('#goalTxt'), goalBar:$('#goalBar'), holding:$('#holding')};
let beltSig = '';
function hud() {
  setText(els.locName, loc().name);
  { const s = season(); setText(els.day, s.name + ', день ' + s.d + ' из ' + SEASON_DAYS); }
  setText(els.clock, clockText());
  setText(els.part, state.min < 720 ? 'утро' : state.min < 1080 ? 'день' : state.min < 1320 ? 'вечер' : 'ночь');
  setText(els.money, String(state.money));
  setText(els.water, state.water + '/' + state.cap);
  setText(els.basket, String(KEYS.reduce((s, k) => s + state.produce[k], 0)));
  if (state.house) { setText(els.goalTxt, 'Дом отремонтирован'); els.goalBar.style.width = '100%'; }
  else { setText(els.goalTxt, 'Ремонт дома: ' + Math.min(state.money, GOAL) + '/' + GOAL); els.goalBar.style.width = Math.min(100, state.money / GOAL * 100) + '%'; }
  const sig = state.day + '|' + state.tool + '|' + state.water + '|' + state.cap + '|' + KEYS.map(k => state.seeds[k]).join(',');
  if (sig !== beltSig) { beltSig = sig; updateBelt(); }
}
const belt = $('#belt'), slots = [];
function buildBelt() {
  belt.innerHTML = ''; slots.length = 0;
  TOOLS.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'slot'; b.title = t.name;
    b.append(iconCanvas(t.id === 'seed' ? 'seed' : t.id, t.k));
    const key = document.createElement('span'); key.className = 'key'; key.textContent = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '−', '='][i] || '';
    const n = document.createElement('span'); n.className = 'n';
    b.append(key, n);
    b.addEventListener('click', () => { state.tool = i; ensureAudio(); hud(); });
    belt.append(b); slots.push({b, n});
  });
  beltSig = '';
}
function updateBelt() {
  TOOLS.forEach((t, i) => {
    const s = slots[i]; if (!s) return;
    s.b.setAttribute('aria-pressed', String(state.tool === i));
    let label = '';
    if (t.id === 'can') label = String(state.water);
    if (t.id === 'seed') label = String(state.seeds[t.k]);
    s.n.textContent = label;
    s.b.classList.toggle('none', t.id === 'seed' && state.seeds[t.k] === 0);
    s.b.classList.toggle('off', t.id === 'seed' && !canPlant(t.k, season().id));
    s.b.setAttribute('aria-label', t.name + (label ? ', ' + label : ''));
  });
  const t = TOOLS[state.tool];
  let h = '';
  if (t.id === 'hoe') h = '<b>Мотыга</b> — вскопать землю на огороде';
  else if (t.id === 'can') h = `<b>Лейка</b> — ${state.water}/${state.cap} л. Полить грядку. Воду набирают в колодце или пруду`;
  else { const d = CROPS[t.k]; h = `<b>${d.seedName}</b> — ${state.seeds[t.k]} шт. Сезон: ${seasonNames(d.plant || d.seasons)}${canPlant(t.k, season().id) ? '' : ' (сейчас не сезон)'}, растёт ${d.grow} ${plural(d.grow, 'день', 'дня', 'дней')}`; }
  els.holding.innerHTML = 'В руках: ' + h;
}

/* ---------- render ---------- */
const cam = {x:0, y:0, ox:0, oy:0};
const shadowCv = document.createElement('canvas'), sctx = shadowCv.getContext('2d');
function camAxis(center, view, world) { return view >= world ? (world - view) / 2 : clamp(center - view / 2, 0, world - view); }
function render(now) {
  const p = player;
  const rx = (p.x + (p.tx - p.x) * p.t) * T, ry = (p.y + (p.ty - p.y) * p.t) * T;
  cam.x = camAxis(rx + T / 2, viewW, W * T); cam.y = camAxis(ry + T / 2, viewH, H * T);
  cam.ox = Math.round(cam.x * S); cam.oy = Math.round(cam.y * S);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0f1638'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, -cam.ox, -cam.oy);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bg, 0, 0);
  const x0 = Math.max(0, Math.floor(cam.x / T)), y0 = Math.max(0, Math.floor(cam.y / T));
  const x1 = Math.min(W - 1, Math.floor((cam.x + viewW) / T)), y1 = Math.min(H - 1, Math.floor((cam.y + viewH) / T)), sec = now / 1000;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const ch = map[y][x], X = x * T, Y = y * T;
    const trod = state.snowCover && state.snowTrod[trodKey(x, y)];
    if (trod && bgBare) { ctx.drawImage(bgBare, X, Y, T, T, X, Y, T, T); drawTrodden(ctx, x, y); }
    if (ch === '~') drawWater(ctx, x, y, sec, inMap(x, y - 1) && map[y - 1][x] !== '~', look.ice);
    else {
      const pl = plotAt(x, y);
      if (pl && pl.t && (!state.snowCover || trod)) drawSoil(ctx, X, Y, pl.w);
    }
  }
  if (!panelOpen && !p.moving) {
    const [fx, fy] = front();
    if (inMap(fx, fy)) {
      const a = 1 / DRAFT;
      ctx.strokeStyle = `rgba(255,250,220,${0.45 + 0.3 * Math.sin(now / 180)})`; ctx.lineWidth = a;
      ctx.strokeRect(fx * T + a / 2, fy * T + a / 2, T - a, T - a);
    }
  }
  /* everything standing on the ground this frame */
  const list = [];
  const inView = (px, py) => px > cam.x - 96 && px < cam.x + viewW + 48 && py > cam.y - 8 && py < cam.y + viewH + 64;
  objects.forEach(o => { if (inView(o.px, o.py) && !(o.kind === 'flower' && plotAt(o.tx, o.ty))) list.push({o:sprite(o.kind, o.kind === 'house' ? state.house : o.a, o.b, look), px:o.px, py:o.py}); });
  for (let y = y0; y <= Math.min(H - 1, y1 + 2); y++) for (let x = x0; x <= x1; x++) {
    const pl = plotAt(x, y);
    if (pl && pl.c) list.push({o:pl.c.dead ? sprite('dead', 0, 0, look) : sprite('crop', pl.c.k, cropStage(pl.c), look), px:x * T + T / 2, py:y * T + T});
  }
  const frame = p.moving ? Math.floor(p.walk * 8) % 2 : 0;
  list.push({o:sprite('player', p.face, frame), px:Math.round(rx) + T / 2, py:Math.round(ry) + T, me:true});
  /* shadows go on their own layer first, so overlapping shadows do not get darker */
  const sun = sunAt(state.min);
  if (sun && sun.alpha > 0.01) {
    if (shadowCv.width !== cv.width || shadowCv.height !== cv.height) { shadowCv.width = cv.width; shadowCv.height = cv.height; }
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, shadowCv.width, shadowCv.height);
    sctx.setTransform(S, 0, 0, S, -cam.ox, -cam.oy); sctx.imageSmoothingEnabled = false;
    list.forEach(it => castShadow(sctx, it.o, it.px, it.py, sun));
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = sun.alpha; ctx.drawImage(shadowCv, 0, 0); ctx.restore();
  }
  list.sort((a, b) => a.py - b.py || (a.me ? 1 : 0) - (b.me ? 1 : 0) || a.px - b.px);
  list.forEach(it => ctx.drawImage(it.o.img, it.px - it.o.ax, it.py - it.o.ay));
  particles.forEach(q => { ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (weatherFor(state.day) === 'snow') drawSnowfall(now);
  applyLight(ctx, cv.width, cv.height, state.min);
  if (fade.a > 0) { ctx.fillStyle = `rgba(5,8,24,${Math.min(1, fade.a)})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}
/* falling snow, in screen space: one flake is one art pixel × 2 */
let flakes = [];
function drawSnowfall(now) {
  const n = Math.round(cv.width * cv.height / (k * k * 2200));
  while (flakes.length < n) flakes.push({x:Math.random(), y:Math.random(), v:.04 + Math.random() * .05, ph:Math.random() * 6});
  flakes.length = n;
  const dt = Math.min(.05, (now - (drawSnowfall.last || now)) / 1000); drawSnowfall.last = now;
  const sz = Math.max(2, k * 2);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  flakes.forEach(f => {
    if (!panelOpen) { f.y += f.v * dt; f.x += Math.sin(now / 900 + f.ph) * .004 * dt * 10; }
    if (f.y > 1) { f.y -= 1; f.x = Math.random(); }
    ctx.fillRect(Math.round(((f.x % 1) + 1) % 1 * cv.width), Math.round(f.y * cv.height), sz, sz);
  });
}

/* ---------- input ---------- */
const SLOT_KEYS = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus', 'Equal'];
const KEYDIR = {ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'};
function frontAct() { if (panelOpen || player.moving) return; const [x, y] = front(); act(x, y); }
window.addEventListener('keydown', e => {
  if (panelOpen) { if ((e.code === 'Escape' || (e.code === 'KeyI' && panel.dataset.kind === 'bag')) && panelClosable) closePanel(); return; }
  const d = KEYDIR[e.code];
  if (d) { e.preventDefault(); ensureAudio(); if (!held.includes(d)) held.push(d); return; }
  if (e.code === 'KeyI') { e.preventDefault(); openInventory(); return; }
  if (e.code === 'Space' || e.code === 'KeyE') { e.preventDefault(); if (!e.repeat) frontAct(); return; }
  const slot = SLOT_KEYS.indexOf(e.code.replace('Numpad', 'Digit'));
  if (slot >= 0 && slot < TOOLS.length) { state.tool = slot; hud(); }
});
window.addEventListener('keyup', e => { const d = KEYDIR[e.code]; if (d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); } });
window.addEventListener('blur', () => { held.length = 0; });

function bfs(sx, sy, isGoal) {
  const prev = new Int32Array(W * H).fill(-2), q = [sy * W + sx];
  prev[sy * W + sx] = -1;
  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi], cx = cur % W, cy = (cur / W) | 0;
    if (isGoal(cx, cy)) {
      const path = []; let c = cur;
      while (prev[c] !== -1) { path.unshift([c % W, (c / W) | 0]); c = prev[c]; }
      return path;
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!walkable(nx, ny)) continue;
      const ni = ny * W + nx;
      if (prev[ni] !== -2) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  return null;
}
cv.addEventListener('pointerdown', e => {
  if (panelOpen) return;
  e.preventDefault(); ensureAudio();
  const r = cv.getBoundingClientRect();
  const tx = Math.floor(((e.clientX - r.left) / r.width * cv.width + cam.ox) / S / T);
  const ty = Math.floor(((e.clientY - r.top) / r.height * cv.height + cam.oy) / S / T);
  if (!inMap(tx, ty)) return;
  const p = player, sx = p.moving ? p.tx : p.x, sy = p.moving ? p.ty : p.y, ch = map[ty][tx];
  const tl = TOOLS[state.tool].id;
  if (INTERACT.includes(ch) || plotAt(tx, ty) || (farmable(tx, ty) && tl !== 'can')) {
    const path = bfs(sx, sy, (x, y) => Math.abs(x - tx) + Math.abs(y - ty) === 1);
    if (!path) return toast('Туда не подойти.');
    held.length = 0; p.path = path; p.pending = {x:tx, y:ty};
  } else if (walkable(tx, ty)) {
    const path = bfs(sx, sy, (x, y) => x === tx && y === ty);
    if (path) { held.length = 0; p.path = path; p.pending = null; }
  }
});
document.querySelectorAll('.pad [data-dir]').forEach(b => {
  const d = b.dataset.dir;
  const off = () => { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); if (!held.includes(d)) held.push(d); try { b.setPointerCapture(e.pointerId); } catch (x) {} });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('#actBtn').addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); frontAct(); });
$('#helpBtn').addEventListener('click', () => { ensureAudio(); openHelp(); });
$('#bagBtn').addEventListener('click', () => { ensureAudio(); openInventory(); });
const soundBtn = $('#soundBtn');
try { soundOn = localStorage.getItem(SAVE_KEY + '-sound') !== 'off'; } catch (e) {}
const syncSound = () => { soundBtn.textContent = 'Звук: ' + (soundOn ? 'вкл' : 'выкл'); };
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; syncSound(); ensureAudio();
  try { localStorage.setItem(SAVE_KEY + '-sound', soundOn ? 'on' : 'off'); } catch (e) {}
});
syncSound();
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
setInterval(() => { if (state) save(); }, 15000);

/* ---------- boot ---------- */
let last = 0;
function loop(now) {
  const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
  update(dt);
  if (bgDirty) { bg = buildBg(); bgDirty = false; }
  render(now); hud();
  requestAnimationFrame(loop);
}
function start(data) {
  state = merge((data && data.state) || load());
  resize(); buildMap(); refreshLook(); player = makePlayer(); buildBelt();
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({state:snap()}));
  if (!state.intro) openIntro(); else toast('С возвращением! День ' + state.day + '.');
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
